name: Manual Calendar Sync

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to sync"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - exams
          - lectures
      verbose:
        description: "Enable verbose logging"
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reconstruct Secure Credentials
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          GCP_TOKEN_PICKLE_B64: ${{ secrets.GCP_TOKEN_PICKLE_B64 }}
        run: |
          if [ -z "$GCP_CREDENTIALS_JSON" ]; then
            echo "::error::Secret GCP_CREDENTIALS_JSON is missing or empty."
            exit 1
          fi
          if [ -z "$GCP_TOKEN_PICKLE_B64" ]; then
            echo "::error::Secret GCP_TOKEN_PICKLE_B64 is missing or empty."
            exit 1
          fi

          echo "$GCP_CREDENTIALS_JSON" > credentials.json
          echo "$GCP_TOKEN_PICKLE_B64" | base64 --decode > token.pickle

          # Verify token.pickle is non-empty
          if [ ! -s token.pickle ]; then
            echo "::error::Failed to reconstruct token.pickle from GCP_TOKEN_PICKLE_B64."
            exit 1
          fi

      - name: Run Sync
        env:
          SOURCE_CALENDAR_NAME: ${{ secrets.SOURCE_CALENDAR_NAME || 'Polimi' }}
          TARGET_CALENDAR_NAME: ${{ secrets.TARGET_CALENDAR_NAME || 'Polimi Colored' }}
          SOURCE_ICAL_URL: ${{ secrets.SOURCE_ICAL_URL }}
        run: |
          if [ "${{ inputs.verbose }}" == "true" ]; then
            python3 src/main.py ${{ inputs.target }} -v
          else
            python3 src/main.py ${{ inputs.target }}
          fi
