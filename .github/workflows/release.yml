name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish to PyPI"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  build-pypi:
    name: Build PyPI Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      - name: Upload PyPI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [build-pypi]
    runs-on: ubuntu-latest
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi)
    steps:
      - name: Download PyPI artifacts
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  build-binaries:
    name: Build standalone binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
            binary_name: unical
            is_windows: false
          - os: macos-14
            target: macos-arm64
            binary_name: unical
            is_windows: false
          - os: windows-latest
            target: windows-x86_64
            binary_name: unical.exe
            is_windows: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build standalone executable
        run: pyinstaller --clean packaging/unical.spec

      - name: Test standalone binary (Unix)
        if: ${{ !matrix.is_windows }}
        run: |
          ./dist/${{ matrix.binary_name }} --help
          ./dist/${{ matrix.binary_name }} auth status

      - name: Test standalone binary (Windows)
        if: ${{ matrix.is_windows }}
        shell: pwsh
        run: |
          .\dist\${{ matrix.binary_name }} --help
          .\dist\${{ matrix.binary_name }} auth status

      - name: Package standalone binary (Unix)
        if: ${{ !matrix.is_windows }}
        run: |
          mkdir -p release-artifacts
          cp dist/${{ matrix.binary_name }} release-artifacts/unical-${{ matrix.target }}
          tar -czvf release-artifacts/unical-${{ matrix.target }}.tar.gz -C dist ${{ matrix.binary_name }}

      - name: Package standalone binary (Windows)
        if: ${{ matrix.is_windows }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts
          Copy-Item dist\${{ matrix.binary_name }} release-artifacts\unical-${{ matrix.target }}.exe
          Compress-Archive -Path dist\${{ matrix.binary_name }} -DestinationPath release-artifacts\unical-${{ matrix.target }}.zip

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [build-pypi, build-binaries]
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Organize release files
        run: |
          mkdir -p release
          # Copy PyPI distributions
          cp all-artifacts/pypi-dist/* release/
          # Copy standalone binaries and archives
          find all-artifacts -type f \( -name "unical-*" \) -exec cp {} release/ \;

      - name: Create macOS release archives
        run: |
          cd release
          if [ -f "unical-macos-arm64" ]; then
            cp unical-macos-arm64 unical-macos-universal
            tar -czvf unical-macos-universal.tar.gz unical-macos-universal
            cp unical-macos-arm64.tar.gz unical-macos-x86_64.tar.gz
          fi

      - name: Compute SHA-256 checksums
        run: |
          cd release
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Update Homebrew formula checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python packaging/homebrew/update_formula.py \
            --version "$VERSION" \
            --release-dir release \
            --output-formula release/unical.rb

      - name: Commit and push updated formula to repository
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/unical.rb packaging/homebrew/unical.rb
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): update Homebrew formula sha256 checksums for ${GITHUB_REF_NAME}"
            git push origin HEAD:main || echo "Warning: Could not push updated formula to main branch"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
